# Development mode with hot-reload:
#   docker compose -f docker-compose.dev.yml up
#
# Backend:  uvicorn --reload picks up edits in ./backend instantly.
# Frontend: Vite dev server with HMR — the browser updates on save, no rebuild.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sattelishmaps-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}

      - HOST=0.0.0.0
      - PORT=8000

      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      - SH_CLIENT_ID=${SH_CLIENT_ID}
      - SH_CLIENT_SECRET=${SH_CLIENT_SECRET}

      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_INTERVAL_HOURS=${SCHEDULER_INTERVAL_HOURS:-6}
      - DEFAULT_SEARCH_BOUNDS=${DEFAULT_SEARCH_BOUNDS:-POLYGON((12 48, 16 48, 16 52, 12 52, 12 48))}
      - DEFAULT_REGION_NAME=${DEFAULT_REGION_NAME:-Trnava}
      - DEFAULT_CLOUD_MAX=${DEFAULT_CLOUD_MAX:-30.0}
      - PROCESS_HISTORICAL_DATA=${PROCESS_HISTORICAL_DATA:-false}
      - COVERAGE_BBOX=${COVERAGE_BBOX:-16.8,47.7,22.6,49.7}
      - PREFER_PIXEL_TILES=${PREFER_PIXEL_TILES:-false}
    volumes:
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./backend:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - sattelishmaps-network

  frontend:
    image: node:20-alpine
    container_name: sattelishmaps-frontend-dev
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      # node_modules live in an anonymous volume: host binaries (glibc) are
      # incompatible with alpine (musl), so the container installs its own
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    networks:
      - sattelishmaps-network

networks:
  sattelishmaps-network:
    driver: bridge
